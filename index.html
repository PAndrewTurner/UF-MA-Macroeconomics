<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECO5207 Macro Study App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation">&#9776;</button>
    <a class="brand" href="#/guide">ECO5207 Macro</a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search guide, formulas, problem sets…" autocomplete="off" aria-label="Search">
      <div id="searchResults" class="search-results" hidden></div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">&#9680;</button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Sections">
      <div class="nav-group">
        <div class="nav-title">Study</div>
        <a href="#/guide" data-view="guide">Study guide</a>
        <div class="toc" id="toc-guide"></div>
        <a href="#/formulas" data-view="formulas">Formula sheet</a>
        <a href="#/problems" data-view="problems">Problem sets worked</a>
        <div class="toc" id="toc-problems"></div>
        <a href="#/practice" data-view="practice">Practice exam</a>
      </div>
      <div class="nav-group">
        <div class="nav-title">Practice</div>
        <a href="#/flashcards" data-view="flashcards">Flashcards</a>
        <a href="#/simulator" data-view="simulator">Shock simulator</a>
      </div>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <!-- Generated by build.py so the app also works when opened as a file. -->
  <script src="assets/content.js"></script>
  <script src="data/flashcards.js"></script>
  <script src="data/shocks.js"></script>
  <script src="assets/render.js"></script>
  <script src="assets/search.js"></script>
  <script src="assets/flashcards.js"></script>
  <script src="assets/simulator.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
